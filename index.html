<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f1117">
<title>MED Y4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style id="basestyle">
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a3040;--txt:#e6e9f0;--dim:#98a0b3;
--acc:#5eb3ff;--acc2:#7ee0c0;--warn:#ffb454;--bad:#ff7b72;--good:#7ee787}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif;
-webkit-text-size-adjust:100%}
#lock,#choose{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#lockbox{width:100%;max-width:360px;text-align:center}
#lockbox .ico{font-size:44px;margin-bottom:10px}
#lockbox h1{font-size:22px;margin:0 0 6px;letter-spacing:1px}
#lockbox p{color:var(--dim);font-size:13.5px;margin:0 0 20px;line-height:1.6}
#pw{width:100%;padding:13px 15px;font-size:16px;border-radius:11px;
border:1px solid var(--line);background:var(--panel);color:var(--txt);outline:none;text-align:center}
#pw:focus{border-color:var(--acc)}
#go{width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:600;border:0;border-radius:11px;
background:var(--acc);color:#08131f;cursor:pointer}
#go:disabled{opacity:.55;cursor:default}
#msg{margin-top:12px;font-size:13.5px;min-height:20px;color:var(--bad)}
#rem{margin-top:14px;font-size:13px;color:var(--dim);display:flex;align-items:center;
justify-content:center;gap:7px;cursor:pointer;user-select:none}
#rem input{accent-color:var(--acc);width:15px;height:15px}
#choosebox{width:100%;max-width:520px}
#choosebox h1{font-size:26px;margin:0 0 4px;text-align:center;letter-spacing:2px}
#choosebox .sub{color:var(--dim);font-size:13.5px;text-align:center;margin-bottom:26px}
.tile{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
border-radius:16px;padding:20px 22px;margin-bottom:14px;cursor:pointer;color:var(--txt);
font-family:inherit;transition:border-color .15s}
.tile:hover{border-color:var(--acc)}
.tile .ti{font-size:30px;line-height:1;margin-bottom:10px}
.tile .th{font-size:18px;font-weight:600;margin-bottom:5px}
.tile .td{font-size:13.5px;color:var(--dim);line-height:1.65}
#backbar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;justify-content:center;
padding:9px;background:linear-gradient(to top,rgba(15,17,23,.97),rgba(15,17,23,0));pointer-events:none}
#backbtn{pointer-events:auto;background:#1e2230;color:#98a0b3;border:1px solid #2a3040;
border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer;font-family:inherit}
#backbtn:hover{color:#e6e9f0;border-color:#5eb3ff}
</style>
</head>
<body>

<div id="lock">
  <div id="lockbox">
    <div class="ico">🩺</div>
    <h1>MED Y4</h1>
    <p>Health and Diseases of Adults and Elderly<br>กรุณาใส่รหัสผ่าน</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" inputmode="text" placeholder="รหัสผ่าน" autofocus>
      <button id="go" type="submit">เข้าสู่เนื้อหา</button>
    </form>
    <label id="rem"><input type="checkbox" id="remchk" checked> จำรหัสไว้ในเครื่องนี้</label>
    <div id="msg"></div>
  </div>
</div>

const SALT="W73qFJLutpMMmRAEScneCA==";
const IV="J+K2IvEGOv7lUumJ";
const ITER=600000;
const KEY="medy4.pw";

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
let DATA=null;

const CHOOSER=`<div id="choose"><div id="choosebox">
  <h1>MED Y4</h1>
  <div class="sub">Health and Diseases of Adults and Elderly · ปี 4</div>
  <button class="tile" data-site="prep">

  </button>
</div></div>`;

async function decrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(BLOB));
  const ds=new DecompressionStream("gzip");
  const stream=new Blob([plain]).stream().pipeThrough(ds);
  const text=await new Response(stream).text();
  return JSON.parse(text);
}

function showChooser(){
  document.querySelectorAll('style[data-site]').forEach(e=>e.remove());
  document.body.innerHTML=CHOOSER;
  document.querySelectorAll('.tile').forEach(function(b){
    b.onclick=function(){ mountSite(b.dataset.site); };
  });
  window.scrollTo(0,0);
}

function mountSite(which){
  const d=DATA[which];
  document.querySelectorAll('style[data-site]').forEach(e=>e.remove());
  const st=document.createElement("style"); st.setAttribute('data-site','1');
  st.textContent=d.css; document.head.appendChild(st);
  document.body.innerHTML=d.html+
    '<div id="backbar"><button id="backbtn">← กลับหน้าแรก</button></div>';
  $("backbtn").onclick=showChooser;
  try{ new Function(d.js)(); }catch(e){ console.error(e); }
  window.scrollTo(0,0);
}

async function tryUnlock(pw,silent){
  $("go").disabled=true; $("msg").style.color="var(--dim)"; $("msg").textContent="กำลังถอดรหัส…";
  try{
    DATA=await decrypt(pw);
    if($("remchk").checked) try{localStorage.setItem(KEY,pw)}catch(e){}
    showChooser();
  }catch(e){
    try{localStorage.removeItem(KEY)}catch(e2){}
    $("go").disabled=false;
    $("msg").style.color="var(--bad)";
    $("msg").textContent=silent?"":"รหัสผ่านไม่ถูกต้อง";
    $("pw").value=""; $("pw").focus();
  }
}

$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const pw=$("pw").value; if(!pw) return;
  tryUnlock(pw,false);
});

(function(){
  let saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved) tryUnlock(saved,true);
})();
