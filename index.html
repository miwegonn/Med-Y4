<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f1117">
<title>ติว Med</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style id="basestyle">
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a3040;--txt:#e6e9f0;--dim:#98a0b3;
--acc:#5eb3ff;--acc2:#7ee0c0;--warn:#ffb454;--bad:#ff7b72;--good:#7ee787}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif;
-webkit-text-size-adjust:100%}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#lockbox{width:100%;max-width:360px;text-align:center}
#lockbox .ico{font-size:44px;margin-bottom:10px}
#lockbox h1{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}
#lockbox p{color:var(--dim);font-size:13.5px;margin:0 0 20px;line-height:1.6}
#pw{width:100%;padding:13px 15px;font-size:16px;border-radius:11px;
border:1px solid var(--line);background:var(--panel);color:var(--txt);outline:none;text-align:center}
#pw:focus{border-color:var(--acc)}
#go{width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:600;border:0;border-radius:11px;
background:var(--acc);color:#08131f;cursor:pointer}
#go:disabled{opacity:.55;cursor:default}
#msg{margin-top:12px;font-size:13.5px;min-height:20px;color:var(--bad)}
#rem{margin-top:14px;font-size:13px;color:var(--dim);display:flex;align-items:center;
justify-content:center;gap:7px;cursor:pointer;user-select:none}
#rem input{accent-color:var(--acc);width:15px;height:15px}
</style>
</head>
<body>

<div id="lock">
  <div id="lockbox">
    <div class="ico">🩺</div>
    <h1>ติว Med</h1>
    <p>Health and Diseases of Adults and Elderly<br>กรุณาใส่รหัสผ่าน</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" inputmode="text" placeholder="รหัสผ่าน" autofocus>
      <button id="go" type="submit">เข้าสู่เนื้อหา</button>
    </form>
    <label id="rem"><input type="checkbox" id="remchk" checked> จำรหัสไว้ในเครื่องนี้</label>
    <div id="msg"></div>
  </div>
</div>

const SALT="PQwkto5bPJdpQmSMZK48Jg==";
const IV="936XgOyQ/ici8FVF";
const ITER=600000;
const KEY="medtutor.pw";

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);

async function decrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(BLOB));
  return JSON.parse(new TextDecoder().decode(plain));
}

function mount(data){
  const st=document.createElement("style"); st.textContent=data.css;
  document.head.appendChild(st);
  $("basestyle").remove();
  $("lock").remove();
  const app=$("app"); app.style.display=""; app.innerHTML=data.html;
  // ย้ายเนื้อหาออกมาไว้ระดับ body เพื่อให้ CSS เดิมทำงานเหมือนไฟล์ต้นฉบับ
  while(app.firstChild) document.body.insertBefore(app.firstChild,app);
  app.remove();
  new Function(data.js)();
}

async function tryUnlock(pw,silent){
  $("go").disabled=true; $("msg").style.color="var(--dim)"; $("msg").textContent="กำลังถอดรหัส…";
  try{
    const data=await decrypt(pw);
    if($("remchk").checked) try{localStorage.setItem(KEY,pw)}catch(e){}
    mount(data);
  }catch(e){
    try{localStorage.removeItem(KEY)}catch(e2){}
    $("go").disabled=false;
    $("msg").style.color="var(--bad)";
    $("msg").textContent=silent?"":"รหัสผ่านไม่ถูกต้อง";
    $("pw").value=""; $("pw").focus();
  }
}

$("f").addEventListener("submit",e=>{
  e.preventDefault();
  const pw=$("pw").value; if(!pw) return;
  tryUnlock(pw,false);
});

// ปลดล็อกอัตโนมัติถ้าเคยจำรหัสไว้
(function(){
  let saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved) tryUnlock(saved,true);
})();
</script>
